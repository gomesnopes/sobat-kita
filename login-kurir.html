<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>

    Login Kurir
  </title>
      <link
  rel="manifest"
  href="./manifest.json"
>

  <!-- TAILWIND -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    body {
      font-family: 'Inter', sans-serif;
    }

  </style>

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

  <div
    class="bg-white rounded-3xl shadow-sm border w-full max-w-md p-8"
  >

    <div class="text-center mb-8">

      <h1 class="text-4xl font-bold text-green-700">
        Sobat Kita
      </h1>

      <p class="text-slate-500 mt-2">
        Login Kurir
      </p>

    </div>

    <form
      id="login-form"
      class="space-y-5"
    >

      <div>

        <label class="text-sm font-medium">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
          class="w-full border rounded-2xl px-4 py-4 mt-2"
        >

      </div>

      <div>

        <label class="text-sm font-medium">
          Password
        </label>

        <input
          type="password"
          id="password"
          required
          class="w-full border rounded-2xl px-4 py-4 mt-2"
        >

      </div>

      <button
        type="submit"
        class="w-full bg-green-700 text-white py-4 rounded-2xl font-semibold"
      >
        Login
      </button>

    </form>

    <div
      id="error-box"
      class="hidden mt-5 bg-red-100 text-red-700 p-4 rounded-2xl text-sm"
    ></div>

  </div>

  <!-- SUPABASE -->

  <script type="module">

    import { supabase }
    from './assets/js/supabase.js'

    const form =
      document.getElementById(
        'login-form'
      )

    const errorBox =
      document.getElementById(
        'error-box'
      )

    form.addEventListener(
      'submit',
      async (e) => {

      e.preventDefault()

      const email =
        document.getElementById(
          'email'
        ).value

      const password =
        document.getElementById(
          'password'
        ).value

      const {
        data,
        error
      } = await supabase

      .from('couriers')

      .select('*')

      .eq('email', email)

      .eq('password', password)

      .single()

      if(error || !data) {

        errorBox.classList.remove(
          'hidden'
        )

        errorBox.innerText =
          'Email atau password salah'

        return
      }

      // SAVE SESSION

      localStorage.setItem(
        'sobatkita_courier',
        JSON.stringify(data)
      )

      // SET ONLINE

      await supabase
      .from('couriers')
      .update({
        is_online: true,
        last_online_at:
          new Date().toISOString()
      })
      .eq('id', data.id)

      // REDIRECT

      window.location.href =
        './kurir.html'
    })

  </script>

</body>

</html>
