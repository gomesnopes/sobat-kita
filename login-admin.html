<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>
    Login Admin
  </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div
    class="bg-white rounded-3xl shadow-sm w-full max-w-md p-8"
  >
    <!-- LOGO -->
    <div class="text-center">
      <img
        src="./logo.png"
        class="w-24 h-24 mx-auto object-contain"
      >
      <h1 class="text-3xl font-bold text-green-700 mt-4">
        Sobat Kita
      </h1>
      <p class="text-slate-500 mt-2">
        Login Dashboard Admin
      </p>
    </div>
    <!-- FORM -->
    <form
      id="login-form"
      class="space-y-5 mt-8"
    >
      <div>
        <label class="text-sm font-medium">
          Email
        </label>
        <input
          type="email"
          id="email"
          required
          class="w-full border rounded-2xl px-4 py-4 mt-2"
        >
      </div>
      <div>
        <label class="text-sm font-medium">
          Password
        </label>
        <input
          type="password"
          id="password"
          required
          class="w-full border rounded-2xl px-4 py-4 mt-2"
        >
      </div>
      <button
        type="submit"
        class="w-full bg-green-700 text-white py-4 rounded-2xl font-semibold"
      >
        Login
      </button>
    </form>
    <!-- ERROR -->
    <div
      id="error-box"
      class="hidden bg-red-100 text-red-700 p-4 rounded-2xl mt-5 text-sm"
    ></div>
  </div>
  <script type="module">
    import { supabase }
    from './assets/js/supabase.js'
    const form =
      document.getElementById(
        'login-form'
      )
    const errorBox =
      document.getElementById(
        'error-box'
      )
    form.addEventListener(
      'submit',
      async (e) => {
      e.preventDefault()
      const email =
        document.getElementById(
          'email'
        ).value
      const password =
        document.getElementById(
          'password'
        ).value
      const {
        data,
        error
      } = await supabase
      .from('admins')
      .select('*')
      .eq('email', email)
      .eq('password', password)
      .single()
      if(error || !data) {
        errorBox.classList.remove(
          'hidden'
        )
        errorBox.innerText =
          'Login gagal'
        return
      }
      localStorage.setItem(
        'sobatkita_admin',
        JSON.stringify(data)
      )
      window.location.href =
        './index.html'
    })
  </script>
</body>
</html>
