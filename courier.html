<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kurir Sobat Kita</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

  <div class="max-w-md mx-auto p-5">

    <!-- LOGIN -->
    <div
      id="login-section"
      class="bg-white rounded-3xl p-6 shadow"
    >

      <h1 class="text-2xl font-bold mb-6">
        Login Kurir
      </h1>

      <input
        id="username"
        type="text"
        placeholder="Username"
        class="w-full bg-slate-100 rounded-2xl px-4 py-3 mb-4"
      >

      <input
        id="phone"
        type="text"
        placeholder="No HP"
        class="w-full bg-slate-100 rounded-2xl px-4 py-3 mb-4"
      >

      <button
        id="btn-login"
        class="w-full bg-green-700 text-white py-3 rounded-2xl"
      >
        Masuk
      </button>

    </div>

    <!-- DASHBOARD -->
    <div
      id="dashboard-section"
      class="hidden"
    >

      <div
        class="bg-white rounded-3xl p-6 shadow mb-4"
      >

        <h2
          id="courier-name"
          class="text-xl font-bold"
        ></h2>

        <div
          class="flex items-center justify-between mt-4"
        >

          <span>
            Status Online
          </span>

          <button
            id="toggle-online"
            class="px-4 py-2 rounded-xl bg-slate-200"
          >
            Offline
          </button>

        </div>

        <button
          id="btn-logout"
          class="w-full mt-4 bg-red-500 text-white py-3 rounded-2xl"
        >
          Logout
        </button>

      </div>

      <div
        id="delivery-list"
        class="space-y-4"
      ></div>

<button
  id="btn-open-scanner"
  class="fixed bottom-6 right-6 bg-green-700 text-white px-6 py-4 rounded-full shadow-xl"
>
  📷 Scan QR
</button>

<div
  id="scanner-modal"
  class="hidden fixed inset-0 bg-black/60 items-center justify-center z-50"
>

  <div
    class="bg-white p-4 rounded-3xl w-full max-w-md mx-4"
  >

    <div class="flex justify-between mb-4">

      <h3 class="font-bold">
        Scan QR Pengantaran
      </h3>

      <button
        id="close-scanner"
      >
        ✕
      </button>

    </div>

    <div
      id="reader"
    ></div>

  </div>

</div>


    </div>

  </div>

  <script
    type="module"
    src="./js/courier.js"
  ></script>

</body>
</html>
