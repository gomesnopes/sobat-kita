<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MedLogix Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: { extend: { colors: { primary: "#006c49", secondary: "#565e74", background: "#f8f9ff", surface: "#ffffff", error: "#ba1a1a" } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-slate-800 min-h-screen antialiased overflow-x-hidden">
    <aside class="w-[280px] h-screen fixed left-0 top-0 bg-surface shadow-sm z-50 flex flex-col py-6 px-4">
        <div class="mb-8 px-3">
            <h1 class="text-2xl font-bold text-primary">MedLogix</h1>
            <p class="text-sm text-secondary mt-1">Hospital Logistics</p>
        </div>
        <nav class="flex-1 space-y-2">
            <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-primary font-bold bg-green-50" href="#">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span> Dashboard
            </a>
        </nav>
        <div class="mt-auto pt-6 border-t border-slate-200">
            <button id="btn-new-dispatch" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-green-800 transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">add</span> New Dispatch
            </button>
        </div>
    </aside>

    <header class="fixed top-0 flex justify-between items-center px-6 py-3 ml-[280px] w-[calc(100%-280px)] bg-surface border-b border-slate-200 z-40 h-[72px]">
        <div class="flex items-center w-96 bg-slate-100 rounded-full px-4 py-2">
            <span class="material-symbols-outlined text-slate-400 mr-3">search</span>
            <input class="bg-transparent border-none focus:ring-0 w-full text-sm outline-none" placeholder="Search orders..." type="text"/>
        </div>
    </header>

    <main class="ml-[280px] pt-[72px] min-h-screen bg-background">
        <div class="p-6 max-w-[1440px] mx-auto">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-bold">System Overview</h2>
                    <p class="text-secondary mt-1">Real-time status of medical logistics network.</p>
                </div>
            </div>

            <div class="bg-surface rounded-xl shadow-sm border border-slate-200 flex flex-col h-[600px]">
                <div class="p-4 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="text-xl font-bold">Recent Orders</h3>
                </div>
                <div class="flex-1 overflow-y-auto p-0">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-white z-10">
                            <tr>
                                <th class="px-4 py-3 text-xs text-secondary uppercase border-b border-slate-200">Order ID</th>
                                <th class="px-4 py-3 text-xs text-secondary uppercase border-b border-slate-200">Pasien</th>
                                <th class="px-4 py-3 text-xs text-secondary uppercase border-b border-slate-200">Alamat</th>
                                <th class="px-4 py-3 text-xs text-secondary uppercase border-b border-slate-200">Status</th>
                                <th class="px-4 py-3 text-xs text-secondary uppercase border-b border-slate-200 text-right">Kurir</th>
                            </tr>
                        </thead>
                        <tbody id="order-table-body" class="text-sm">
                            <tr><td colspan="5" class="text-center py-8 text-slate-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="dispatchModal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-primary">Kirim Obat Baru</h3>
                <button id="closeModalBtn" class="material-symbols-outlined text-slate-500 hover:text-red-600">close</button>
            </div>
            <form id="dispatchForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">No. Resep</label>
                    <input type="text" id="no_resep" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pasien</label>
                    <input type="text" id="nama_pasien" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">No WhatsApp (Gunakan 62)</label>
                    <input type="text" id="no_whatsapp" placeholder="628..." required class="w-full rounded-lg border border-slate-300 px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Alamat Tujuan</label>
                    <textarea id="alamat" rows="3" required class="w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
                </div>
                <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-green-800">Simpan & Buat QR</button>
            </form>

            <div id="qrContainer" class="hidden mt-4 flex flex-col items-center p-4 bg-slate-50 rounded-lg border-2 border-dashed border-primary">
                <p class="text-sm font-bold text-primary mb-3">Arahkan Kamera HP Kurir ke Sini</p>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // ISI DENGAN KUNCI SUPABASE ANDA!
        const supabase = createClient('https://twunssclwdvwdbjwsysc.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dW5zc2Nsd2R2d2RiandzeXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDExOTksImV4cCI6MjA5NTI3NzE5OX0.z_ME9KMif183URkPRs9JpRFhsudaNTLzojdmc7GuP1c');

        // Modal Logic
        const modal = document.getElementById('dispatchModal');
        const form = document.getElementById('dispatchForm');
        const qrContainer = document.getElementById('qrContainer');
        
        document.getElementById('btn-new-dispatch').addEventListener('click', () => {
            modal.classList.remove('hidden');
            form.classList.remove('hidden');
            qrContainer.classList.add('hidden');
            form.reset();
        });
        
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // Submit Logic
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                order_number: document.getElementById('no_resep').value,
                patient_name: document.getElementById('nama_pasien').value,
                patient_phone: document.getElementById('no_whatsapp').value,
                dropoff_address: document.getElementById('alamat').value,
                status: 'Pending'
            };

            const { data, error } = await supabase.from('deliveries').insert([payload]).select();
            if (error) return alert('Gagal: ' + error.message);

            form.classList.add('hidden');
            qrContainer.classList.remove('hidden');
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: `${window.location.origin}/kurir-detail.html?id=${data[0].id}`,
                width: 200, height: 200
            });
        });

        // Load Table Data
        async function loadTable() {
            const { data } = await supabase.from('deliveries').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('order-table-body');
            tbody.innerHTML = "";
            
            data.forEach(order => {
                let badge = `<span class="bg-slate-200 px-2 py-1 rounded text-xs font-bold">${order.status}</span>`;
                if(order.status === 'In Transit') badge = `<span class="bg-blue-200 text-blue-800 px-2 py-1 rounded text-xs font-bold">Diantar</span>`;
                if(order.status === 'Completed') badge = `<span class="bg-green-200 text-green-800 px-2 py-1 rounded text-xs font-bold">Selesai</span>`;

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-4 py-3 font-bold">#${order.order_number}</td>
                        <td class="px-4 py-3">${order.patient_name}</td>
                        <td class="px-4 py-3">${order.dropoff_address}</td>
                        <td class="px-4 py-3">${badge}</td>
                        <td class="px-4 py-3 text-right font-bold text-primary">${order.courier_name || '-'}</td>
                    </tr>
                `;
            });
        }

        // Realtime Listener
        supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'deliveries' }, (payload) => {
                loadTable();
            }).subscribe();

        loadTable();
    </script>
</body>
</html>
