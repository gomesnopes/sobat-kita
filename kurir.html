<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>
    Sobat Kita - Kurir
  </title>
  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <!-- HEADER -->
    <div
      class="bg-green-700 text-white rounded-3xl p-8 mb-8"
    >
      <h1 class="text-4xl font-bold">
        Dashboard Kurir
      </h1>
      <p class="mt-2 text-green-100">
        Sobat Kita
      </p>
    </div>
    <!-- TASKS -->
    <div
      id="tasks-container"
      class="grid grid-cols-1 md:grid-cols-2 gap-6"
    >
      <!-- CARD -->
    </div>
  </div>
  <!-- SUPABASE -->
  <script type="module">
    import { supabase }
    from './assets/js/supabase.js'
    const container =
      document.getElementById(
        'tasks-container'
      )
    async function loadTasks() {
      const { data, error } =
        await supabase
        .from('deliveries')
        .select('*')
        .neq('status', 'completed')
        .order('created_at', {
          ascending: false
        })
      if(error) {
        console.log(error)
        return
      }
      renderTasks(data)
    }
    function renderTasks(data) {
      container.innerHTML = ''
      if(data.length === 0) {
        container.innerHTML = `
          <div
            class="bg-white rounded-3xl p-10 text-center col-span-full"
          >
            <h2 class="text-2xl font-bold text-slate-700">
              Tidak Ada Tugas
            </h2>
          </div>
        `
        return
      }
      data.forEach(item => {
        let badge = `
          <span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-sm">
            Pending
          </span>
        `
        if(item.status === 'on_delivery') {
          badge = `
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">
              Sedang Diantar
            </span>
          `
        }
        container.innerHTML += `
          <div
            class="bg-white rounded-3xl border shadow-sm p-6"
          >
            <div
              class="flex justify-between items-start mb-5"
            >
              <div>
                <h2 class="text-2xl font-bold">
                  ${item.patient_name}
                </h2>
                <p class="text-slate-500 mt-1">
                  ${item.patient_phone}
                </p>
              </div>
              ${badge}
            </div>
            <div class="space-y-4">
              <div>
                <p class="text-sm text-slate-500">
                  Kelurahan
                </p>
                <p class="font-semibold">
                  ${item.kelurahan}
                </p>
              </div>
              <div>
                <p class="text-sm text-slate-500">
                  Alamat
                </p>
                <p class="font-semibold">
                  ${item.address}
                </p>
              </div>
              <div>
                <p class="text-sm text-slate-500">
                  Ongkir
                </p>
                <p class="font-bold text-green-700">
                  Rp ${parseInt(
                    item.ongkir || 0
                  ).toLocaleString()}
                </p>
              </div>
            </div>
            <!-- ACTIONS -->
            <div class="grid grid-cols-2 gap-3 mt-6">
              <a
                href="https://maps.google.com/?q=${encodeURIComponent(item.address)}"
                target="_blank"
                class="bg-slate-100 text-center py-3 rounded-xl font-semibold"
              >
                Maps
              </a>
              <button
                onclick="updateStatus('${item.id}', '${item.status}')"
                class="bg-green-700 text-white py-3 rounded-xl font-semibold"
              >
                ${
                  item.status === 'pending'
                  ? 'Mulai Antar'
                  : 'Selesaikan'
                }
              </button>
            </div>
          </div>
        `
      })
    }
    window.updateStatus =
      async (id, currentStatus) => {
      let nextStatus =
        'completed'
      if(currentStatus === 'pending') {
        nextStatus =
          'on_delivery'
      }
      const { error } =
        await supabase
        .from('deliveries')
        .update({
          status: nextStatus
        })
        .eq('id', id)
      if(error) {
        alert(error.message)
        return
      }
      loadTasks()
    }
    // REALTIME
    supabase
    .channel('kurir-deliveries')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'deliveries'
      },
      () => {
        loadTasks()
      }
    )
    .subscribe()
    loadTasks()
  </script>
</body>
</html>
