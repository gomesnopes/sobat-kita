<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Sobat Kita Kurir
  </title>
    <link
  rel="manifest"
  href="./manifest.json"
>
  <!-- PWA -->

  <meta
    name="theme-color"
    content="#15803d"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- TAILWIND -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
    }

  </style>

</head>

<body class="min-h-screen">

  <!-- AUTH CHECK -->

  <script>

    const courierSession =
    JSON.parse(
      localStorage.getItem(
        'sobatkita_courier'
      )
    )

    if(!courierSession) {

      window.location.href =
        './login-kurir.html'
    }

  </script>

  <!-- HEADER -->

  <div
    class="sticky top-0 z-40 bg-white border-b"
  >

    <div class="p-5">

      <div
        class="flex items-center justify-between"
      >

        <div>

          <h1 class="text-2xl font-bold text-green-700">
            Sobat Kita
          </h1>

          <p
            id="courier-name"
            class="text-sm text-slate-500 mt-1"
          >
            Kurir
          </p>

        </div>

        <button
          id="logout-btn"
          class="bg-red-100 text-red-700 px-4 py-2 rounded-xl text-sm"
        >
          Logout
        </button>

      </div>

      <!-- STATUS -->

      <div
        class="mt-5 bg-slate-100 rounded-3xl p-5 flex items-center justify-between"
      >

        <div>

          <p class="text-sm text-slate-500">
            Status Kurir
          </p>

          <h3
            id="online-status-text"
            class="text-2xl font-bold mt-1"
          >
            Offline
          </h3>

        </div>

        <button
          id="toggle-online-btn"
          class="bg-green-700 text-white px-5 py-4 rounded-2xl font-semibold"
        >
          Saya Online
        </button>

      </div>

    </div>

  </div>

  <!-- TASKS -->

  <div
    id="tasks-container"
    class="p-5 space-y-5 pb-32"
  >

  </div>

  <!-- BOTTOM NAV -->

  <div
    class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 z-50"
  >

    <div
      class="grid grid-cols-3 gap-3"
    >

      <button
        class="bg-green-700 text-white py-4 rounded-2xl font-semibold"
      >
        Tugas
      </button>

      <button
        id="refresh-btn"
        class="bg-slate-100 py-4 rounded-2xl font-semibold"
      >
        Refresh
      </button>

      <button
        id="scan-btn"
        class="bg-blue-600 text-white py-4 rounded-2xl font-semibold"
      >
        Scan QR
      </button>

    </div>

  </div>
<!-- QR MODAL -->
<div
  id="scanner-modal"
  class="fixed inset-0 bg-black z-[999] hidden flex-col"
>
  <div
    class="flex items-center justify-between p-5 text-white"
  >
    <h2 class="text-xl font-bold">
      Scan QR Pengantaran
    </h2>
    <button
      id="close-scanner"
      class="text-2xl"
    >
      ✕
    </button>
  </div>
  <div
    id="reader"
    class="flex-1"
  ></div>
</div>
  <!-- SUPABASE -->

  <script type="module">

    import { supabase }
    from './assets/js/supabase.js'

    // ELEMENTS

    const container =
      document.getElementById(
        'tasks-container'
      )

    const courierName =
      document.getElementById(
        'courier-name'
      )

    const onlineBtn =
      document.getElementById(
        'toggle-online-btn'
      )

    const onlineStatusText =
      document.getElementById(
        'online-status-text'
      )

    // SESSION

    courierName.innerText =
      courierSession.nama_kurir

    let isOnline =
      courierSession.is_online

    // RENDER ONLINE STATUS

    function renderOnlineStatus() {

      if(isOnline) {

        onlineStatusText.innerText =
          'Online'

        onlineBtn.innerText =
          'Saya Offline'

        onlineBtn.className =
          'bg-red-600 text-white px-5 py-4 rounded-2xl font-semibold'

      } else {

        onlineStatusText.innerText =
          'Offline'

        onlineBtn.innerText =
          'Saya Online'

        onlineBtn.className =
          'bg-green-700 text-white px-5 py-4 rounded-2xl font-semibold'
      }
    }

    renderOnlineStatus()

    // TOGGLE ONLINE

    onlineBtn.addEventListener(
      'click',
      async () => {

      isOnline = !isOnline

      await supabase
      .from('couriers')
      .update({
        is_online: isOnline,
        last_online_at:
          new Date().toISOString()
      })
      .eq(
        'id',
        courierSession.id
      )

      courierSession.is_online =
        isOnline

      localStorage.setItem(
        'sobatkita_courier',
        JSON.stringify(
          courierSession
        )
      )

      renderOnlineStatus()
    })

    // LOAD TASKS

    async function loadTasks() {

      const {
        data,
        error
      } = await supabase

      .from('deliveries')

      .select('*')

      .eq(
        'courier_id',
        courierSession.id
      )

      .order(
        'created_at',
        {
          ascending: false
        }
      )

      if(error) {

        console.log(error)
        return
      }

      renderTasks(data || [])
    }

    // GPS TRACKING
function startGPS() {
  if(!navigator.geolocation) {
    return
  }
  navigator.geolocation.watchPosition(
    async (position) => {
      const latitude =
        position.coords.latitude
      const longitude =
        position.coords.longitude
      await supabase
      .from('couriers')
      .update({
        latitude,
        longitude
      })
      .eq(
        'id',
        courierSession.id
      )
    },
    (err) => {
      console.log(err)
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 5000
    }
  )
}
startGPS()

    // RENDER TASKS

    function renderTasks(data) {

      container.innerHTML = ''

      if(data.length === 0) {

        container.innerHTML = `

          <div
            class="bg-white rounded-3xl p-10 text-center"
          >

            <h2 class="text-2xl font-bold text-slate-700">
              Tidak Ada Tugas
            </h2>

            <p class="text-slate-500 mt-2">
              Menunggu pengantaran baru
            </p>

          </div>
        `

        return
      }

      data.forEach(item => {

        let badge = `
          <span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-sm">
            Pending
          </span>
        `

        if(item.status === 'on_delivery') {

          badge = `
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">
              Sedang Diantar
            </span>
          `
        }

        if(item.status === 'completed') {

          badge = `
            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
              Selesai
            </span>
          `
        }

        container.innerHTML += `

          <div
            class="bg-white rounded-3xl shadow-sm p-5"
          >

            <div
              class="flex items-start justify-between mb-5"
            >

              <div>

                <h2 class="text-2xl font-bold">
                  ${item.patient_name}
                </h2>

                <p class="text-slate-500 mt-1">
                  ${item.patient_phone || '-'}
                </p>

              </div>

              ${badge}

            </div>

            <!-- INFO -->

            <div class="space-y-4">

              <div>

                <p class="text-sm text-slate-500">
                  Kelurahan
                </p>

                <p class="font-semibold">
                  ${item.kelurahan}
                </p>

              </div>

              <div>

                <p class="text-sm text-slate-500">
                  Alamat
                </p>

                <p class="font-semibold">
                  ${item.address || '-'}
                </p>

              </div>

              <div>

                <p class="text-sm text-slate-500">
                  Ongkir
                </p>

                <p class="font-bold text-green-700">
                  Rp ${parseInt(
                    item.ongkir || 0
                  ).toLocaleString()}
                </p>

              </div>

            </div>

            <!-- ACTIONS -->

            <div
              class="grid grid-cols-2 gap-3 mt-6"
            >

              <a
                href="https://maps.google.com/?q=${encodeURIComponent(item.address)}"
                target="_blank"
                class="bg-slate-100 text-center py-4 rounded-2xl font-semibold"
              >
                Maps
              </a>

              <button
                onclick="updateStatus('${item.id}', '${item.status}')"
                class="bg-green-700 text-white py-4 rounded-2xl font-semibold"
              >
                ${
                  item.status === 'pending'
                  ? 'Mulai Antar'
                  : item.status === 'on_delivery'
                  ? 'Selesaikan'
                  : 'Selesai'
                }
              </button>

            </div>

          </div>
        `
      })
    }

    // UPDATE STATUS

    window.updateStatus =
      async (id, currentStatus) => {

      let nextStatus =
        'completed'

      if(currentStatus === 'pending') {

        nextStatus =
          'on_delivery'
      }

      const { error } =
        await supabase

        .from('deliveries')

        .update({
          status: nextStatus
        })

        .eq('id', id)

      if(error) {

        alert(error.message)
        return
      }

      loadTasks()
    }

    // REFRESH

    document.getElementById(
      'refresh-btn'
    )
    .addEventListener(
      'click',
      () => {

      loadTasks()
    })

    // LOGOUT

    document.getElementById(
      'logout-btn'
    )
    .addEventListener(
      'click',
      async () => {

      await supabase

      .from('couriers')

      .update({
        is_online: false
      })

      .eq(
        'id',
        courierSession.id
      )

      localStorage.removeItem(
        'sobatkita_courier'
      )

      window.location.href =
        './login-kurir.html'
    })

    // SCAN BUTTON

    document.getElementById(
      'scan-btn'
    )
    .addEventListener(
      'click',
      () => {

   openScanner()
    })

    // REALTIME

    supabase
    .channel('kurir-realtime')

    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'deliveries'
      },
      () => {

        loadTasks()
      }
    )

    .subscribe()

    // INITIAL

    loadTasks()
const scannerModal =
document.getElementById(
  'scanner-modal'
)
const closeScannerBtn =
document.getElementById(
  'close-scanner'
)
let html5QrCode = null
function openScanner() {
  scannerModal
    .classList
    .remove('hidden')
  scannerModal
    .classList
    .add('flex')
  html5QrCode =
    new Html5Qrcode(
      'reader'
    )
  html5QrCode.start(
    {
      facingMode: 'environment'
    },
    {
      fps: 10,
      qrbox: 250
    },
    async (decodedText) => {
      // SUCCESS
      await html5QrCode.stop()
      scannerModal
        .classList
        .add('hidden')
      handleQRResult(
        decodedText
      )
    },
    (errorMessage) => {
      // ignore scan errors
    }
  )
}
closeScannerBtn.addEventListener(
  'click',
  async () => {
  if(html5QrCode) {
    await html5QrCode.stop()
  }
  scannerModal
    .classList
    .add('hidden')
})
async function handleQRResult(qrText) {
  try {
    const url =
      new URL(qrText)
    const token =
      url.searchParams.get(
        'token'
      )
    if(!token) {
      alert(
        'QR tidak valid'
      )
      return
    }
    // FIND DELIVERY
    const {
      data,
      error
    } = await supabase
    .from('deliveries')
    .select('*')
    .eq('qr_token', token)
    .single()
    if(error || !data) {
      alert(
        'Pengantaran tidak ditemukan'
      )
      return
    }
    // ASSIGN TO COURIER
    const { error: updateError } =
      await supabase
      .from('deliveries')
      .update({
        courier_id:
          courierSession.id,
        courier_name:
          courierSession.nama_kurir,
        status:
          'on_delivery'
      })
      .eq('id', data.id)
    if(updateError) {
      alert(
        updateError.message
      )
      return
    }
    alert(
      'Pengantaran berhasil diambil 😄'
    )
    loadTasks()
  } catch(err) {
    alert(
      'QR tidak valid'
    )
  }
}
  </script>
<script src="https://unpkg.com/html5-qrcode"></script>
  <script>
if(
  'serviceWorker'
  in navigator
) {
  navigator
  .serviceWorker
  .register('./sw.js')
  .then(() => {
    console.log(
      'SW Registered'
    )
  })
}
</script>
</body>

</html>
