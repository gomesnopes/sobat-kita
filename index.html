<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sobat Kita</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body class="bg-slate-100">

  <div class="flex h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r flex flex-col">

      <div class="p-6 border-b">
        <h1 class="text-3xl font-bold text-green-700">
          Sobat Kita
        </h1>

        <p class="text-sm text-slate-500 mt-1">
          Admin Dashboard
        </p>
      </div>

      <nav class="p-4 space-y-2">

        <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-green-50 text-green-700 font-semibold">

          <span class="material-symbols-outlined">
            local_shipping
          </span>

          Pengantaran

        </button>

        <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-100">

          <span class="material-symbols-outlined">
            motorcycle
          </span>

          Kurir

        </button>

      </nav>

    </aside>

    <!-- CONTENT -->
    <main class="flex-1 overflow-auto">

      <!-- HEADER -->
      <header class="bg-white border-b px-8 py-4 flex justify-between items-center">

        <div>
          <h2 class="text-2xl font-bold text-slate-800">
            Dashboard
          </h2>

          <p class="text-sm text-slate-500">
            Monitoring pengantaran obat
          </p>
        </div>

        <button
          id="btn-new-delivery"
          class="bg-green-700 hover:bg-green-800 text-white px-5 py-3 rounded-xl font-semibold"
        >
          + Pengantaran Baru
        </button>

      </header>

      <!-- CONTENT AREA -->
      <section class="p-8">

        <!-- STATS -->
        <div class="grid grid-cols-3 gap-6 mb-8">

          <div class="bg-white rounded-2xl p-6 shadow-sm border">

            <p class="text-slate-500 text-sm">
              Total Pengantaran
            </p>

            <h3 class="text-4xl font-bold mt-2 text-slate-800">
              0
            </h3>

          </div>

          <div class="bg-white rounded-2xl p-6 shadow-sm border">

            <p class="text-slate-500 text-sm">
              Sedang Diantar
            </p>

            <h3 class="text-4xl font-bold mt-2 text-blue-600">
              0
            </h3>

          </div>

          <div class="bg-white rounded-2xl p-6 shadow-sm border">

            <p class="text-slate-500 text-sm">
              Selesai
            </p>

            <h3 class="text-4xl font-bold mt-2 text-green-600">
              0
            </h3>

          </div>

        </div>

        <!-- TABLE -->
        <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">

          <div class="px-6 py-4 border-b">

            <h3 class="font-bold text-lg">
              Data Pengantaran
            </h3>

          </div>

          <table class="w-full">

            <thead class="bg-slate-50 text-left">

              <tr>

                <th class="px-6 py-4 text-sm text-slate-500">
                  Pasien
                </th>

                <th class="px-6 py-4 text-sm text-slate-500">
                  Kelurahan
                </th>

                <th class="px-6 py-4 text-sm text-slate-500">
                  Status
                </th>

              </tr>

            </thead>

            <tbody id="delivery-table-body">

            </tbody>

          </table>

        </div>

      </section>

    </main>

  </div>

  <script type="module" src="./assets/js/app.js"></script>

</body>
</html>
