<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MedLogix Admin - Ternate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style> body { font-family: sans-serif; background-color: #f8f9ff; } </style>
</head>
<body class="text-slate-800 min-h-screen flex overflow-hidden">
    
    <!-- Sidebar / Navigasi Tabs -->
    <aside class="w-64 bg-white shadow-md z-20 flex flex-col h-screen">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-2xl font-bold text-green-700">MedLogix</h1>
            <p class="text-xs text-slate-500">Logistik Apotek Ternate</p>
        </div>
        <nav class="p-4 space-y-2 flex-1">
            <button id="nav-orders" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-green-50 text-green-700 font-bold transition-colors text-left">
                <span class="material-symbols-outlined">package_2</span> Pengantaran
            </button>
            <button id="nav-couriers" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition-colors text-left">
                <span class="material-symbols-outlined">motorcycle</span> Mitra Kurir
            </button>
            <button id="nav-fees" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition-colors text-left">
                <span class="material-symbols-outlined">map</span> Tarif Kelurahan
            </button>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Header & Search -->
        <header class="bg-white px-8 py-4 border-b border-slate-200 flex justify-between items-center shadow-sm z-10">
            <div class="flex items-center w-96 bg-slate-100 rounded-full px-4 py-2 border border-slate-200 focus-within:border-green-500 focus-within:bg-white transition-all">
                <span class="material-symbols-outlined text-slate-400 mr-2 text-xl">search</span>
                <input id="searchInput" class="bg-transparent border-none focus:ring-0 w-full text-sm outline-none" placeholder="Cari No. Resep, Pasien, atau Alamat..." type="text"/>
            </div>
            <div class="flex gap-4">
                <button id="btn-add-courier" class="hidden bg-slate-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-slate-700 flex items-center gap-2">
                    <span class="material-symbols-outlined">person_add</span> Tambah Kurir
                </button>
                <button id="btn-new-dispatch" class="bg-green-700 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-800 flex items-center gap-2 shadow-md">
                    <span class="material-symbols-outlined">add_box</span> Pengantaran Baru
                </button>
            </div>
        </header>

        <!-- TAB 1: ORDERS (PENGANTARAN) -->
        <div id="tab-orders" class="tab-content flex-1 p-8 overflow-y-auto">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Resep & Pasien</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Tujuan & Tarif</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Status & Kurir</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: COURIERS -->
        <div id="tab-couriers" class="tab-content hidden flex-1 p-8 overflow-y-auto bg-slate-50">
            <h2 class="text-2xl font-bold mb-4">Daftar Mitra Kurir</h2>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Nama Mitra</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">WhatsApp</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Status</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Terakhir Aktif</th>
                        </tr>
                    </thead>
                    <tbody id="courier-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 3: FEES (ONGKIR) -->
        <div id="tab-fees" class="tab-content hidden flex-1 p-8 overflow-y-auto bg-slate-50">
            <h2 class="text-2xl font-bold mb-4">Tarif Kelurahan Kota Ternate</h2>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 max-w-2xl">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Kecamatan</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase">Kelurahan</th>
                            <th class="px-4 py-3 text-xs text-slate-500 uppercase text-right">Tarif (Rp)</th>
                        </tr>
                    </thead>
                    <tbody id="fee-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL: FORM PENGANTARAN BARU -->
    <div id="dispatchModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold text-green-700">Buat Pengantaran Baru</h3>
                <button class="close-modal material-symbols-outlined text-slate-400 hover:text-red-500">close</button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="dispatchForm" class="space-y-4">
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-2">Daftar Obat / No. Resep</label>
                        <div id="resep-container" class="space-y-2">
                            <input type="text" name="resep[]" placeholder="Contoh: RES-001" required class="w-full rounded-md border-slate-300 px-3 py-2 text-sm focus:border-green-500 outline-none border">
                        </div>
                        <button type="button" id="btn-tambah-resep" class="mt-2 text-xs font-bold text-green-700 flex items-center gap-1 hover:underline">
                            <span class="material-symbols-outlined text-[16px]">add_circle</span> Tambah Obat Lain
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nama Pasien</label>
                            <input type="text" id="nama_pasien" required class="w-full rounded-md border-slate-300 px-3 py-2 text-sm border">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp (62...)</label>
                            <input type="text" id="no_whatsapp" required class="w-full rounded-md border-slate-300 px-3 py-2 text-sm border">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Kelurahan Tujuan (Ternate)</label>
                        <select id="kelurahan_select" required class="w-full rounded-md border-slate-300 px-3 py-2 text-sm border bg-white">
                            <option value="">Memuat data kelurahan...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Detail Alamat</label>
                        <textarea id="alamat" rows="2" required class="w-full rounded-md border-slate-300 px-3 py-2 text-sm border"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-green-700 text-white py-3 rounded-lg font-bold hover:bg-green-800 shadow-md">
                        Simpan & Buat QR
                    </button>
                </form>

                <div id="qrContainer" class="hidden flex flex-col items-center py-6">
                    <div class="bg-green-50 p-4 rounded-xl border border-green-200 text-center w-full mb-4">
                        <p class="font-bold text-green-800">Berhasil Dibuat!</p>
                        <p id="assigned-courier-text" class="text-sm text-green-700 mt-1"></p>
                    </div>
                    <div id="qrcode" class="p-2 bg-white rounded-lg shadow-sm border"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: EDIT STATUS & VIEW QR -->
    <div id="actionModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-96 shadow-2xl p-6 text-center">
            <h3 class="text-lg font-bold mb-4">Aksi Pengantaran</h3>
            <div id="re-qr-container" class="flex justify-center mb-4"></div>
            
            <p class="text-sm font-bold text-slate-600 mb-2">Ubah Status</p>
            <div class="flex gap-2 justify-center mb-6">
                <button onclick="updateStatus('Pending')" class="px-3 py-1 bg-slate-200 rounded text-sm font-bold hover:bg-slate-300">Pending</button>
                <button onclick="updateStatus('In Transit')" class="px-3 py-1 bg-blue-200 text-blue-800 rounded text-sm font-bold hover:bg-blue-300">Diantar</button>
                <button onclick="updateStatus('Completed')" class="px-3 py-1 bg-green-200 text-green-800 rounded text-sm font-bold hover:bg-green-300">Selesai</button>
            </div>
            <button class="close-modal w-full py-2 bg-slate-100 rounded-lg text-slate-600 font-bold">Tutup</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script type="module">
       import { supabase } from './js/supabase-config.js';

    

        // --- MANAJEMEN TAB ---
        const tabs = ['orders', 'couriers', 'fees'];
        tabs.forEach(tab => {
            document.getElementById(`nav-${tab}`).addEventListener('click', (e) => {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-green-50', 'text-green-700');
                    btn.classList.add('text-slate-600');
                });
                e.currentTarget.classList.remove('text-slate-600');
                e.currentTarget.classList.add('bg-green-50', 'text-green-700');

                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`tab-${tab}`).classList.remove('hidden');

                document.getElementById('btn-new-dispatch').classList.toggle('hidden', tab !== 'orders');
                document.getElementById('btn-add-courier').classList.toggle('hidden', tab !== 'couriers');
            });
        });

        // --- FITUR MODAL ---
        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('dispatchModal').classList.add('hidden');
                document.getElementById('actionModal').classList.add('hidden');
            });
        });

        document.getElementById('btn-new-dispatch').addEventListener('click', () => {
            document.getElementById('dispatchModal').classList.remove('hidden');
            document.getElementById('dispatchForm').classList.remove('hidden');
            document.getElementById('qrContainer').classList.add('hidden');
            document.getElementById('dispatchForm').reset();
            document.getElementById('resep-container').innerHTML = `<input type="text" name="resep[]" placeholder="Contoh: RES-001" required class="w-full rounded-md border-slate-300 px-3 py-2 text-sm focus:border-green-500 outline-none border">`;
        });

        document.getElementById('btn-tambah-resep').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'text';
            input.name = 'resep[]';
            input.placeholder = 'No. Resep Tambahan';
            input.className = 'w-full rounded-md border-slate-300 px-3 py-2 text-sm focus:border-green-500 outline-none border mt-2';
            document.getElementById('resep-container').appendChild(input);
        });

        // --- FITUR SEARCH ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#order-table-body tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(keyword) ? '' : 'none';
            });
        });

        // --- FUNGSI LOAD DATA SUPABASE ---
        async function loadFees() {
            const { data } = await supabase.from('kelurahan_fees').select('*').order('kecamatan');
            const tbody = document.getElementById('fee-table-body');
            const select = document.getElementById('kelurahan_select');
            tbody.innerHTML = ""; select.innerHTML = "<option value=''>Pilih Kelurahan...</option>";
            
            if(data) {
                data.forEach(fee => {
                    tbody.innerHTML += `<tr class="border-b border-slate-100"><td class="px-4 py-3">${fee.kecamatan}</td><td class="px-4 py-3 font-bold">${fee.nama_kelurahan}</td><td class="px-4 py-3 text-right">Rp ${fee.tarif.toLocaleString()}</td></tr>`;
                    select.innerHTML += `<option value="${fee.nama_kelurahan}|${fee.tarif}">${fee.nama_kelurahan} - Rp ${fee.tarif.toLocaleString()}</option>`;
                });
            }
        }

        async function loadCouriers() {
            const { data } = await supabase.from('couriers').select('*').order('nama_kurir');
            const tbody = document.getElementById('courier-table-body');
            tbody.innerHTML = "";
            if(data) {
                data.forEach(c => {
                    const statusColor = c.status === 'Tersedia' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
                    tbody.innerHTML += `<tr class="border-b border-slate-100"><td class="px-4 py-3 font-bold">${c.nama_kurir}</td><td class="px-4 py-3">${c.no_whatsapp || '-'}</td><td class="px-4 py-3"><span class="${statusColor} px-2 py-1 rounded text-xs font-bold">${c.status}</span></td><td class="px-4 py-3 text-xs text-slate-500">${new Date(c.last_assigned_at).toLocaleString('id-ID')}</td></tr>`;
                });
            }
        }

        async function loadOrders() {
            const { data } = await supabase.from('deliveries').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('order-table-body');
            tbody.innerHTML = "";
            
            if(data) {
                data.forEach(order => {
                    let badge = `<span class="bg-slate-200 px-2 py-1 rounded text-xs font-bold">${order.status}</span>`;
                    if(order.status === 'In Transit') badge = `<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">Diantar</span>`;
                    if(order.status === 'Completed') badge = `<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">Selesai</span>`;

                    tbody.innerHTML += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50">
                            <td class="px-4 py-3"><p class="font-bold text-green-700 max-w-[150px]">${order.order_numbers}</p><p class="font-medium">${order.patient_name}</p></td>
                            <td class="px-4 py-3"><p class="font-bold">${order.kelurahan}</p><p class="text-xs text-slate-500 truncate max-w-[200px]">${order.dropoff_address}</p><p class="text-xs font-bold text-amber-600 mt-1">Ongkir: Rp ${order.tarif.toLocaleString()}</p></td>
                            <td class="px-4 py-3"><div class="mb-1">${badge}</div><p class="text-xs font-bold text-slate-600">${order.courier_name || 'Belum Diambil'}</p></td>
                            <td class="px-4 py-3 text-right">
                                <button onclick="window.openActionModal('${order.id}')" class="text-slate-400 hover:text-green-600 p-1 bg-slate-100 rounded">
                                    <span class="material-symbols-outlined">qr_code_2</span>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        // --- SUBMIT PENGANTARAN ---
        document.getElementById('dispatchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('input[name="resep[]"]');
            const joinedResep = Array.from(inputs).map(i => i.value).filter(i => i.trim() !== "").join(", ");
            const [kelurahan, tarifStr] = document.getElementById('kelurahan_select').value.split("|");
            
            const { data: couriers } = await supabase.from('couriers').select('*').eq('status', 'Tersedia').order('last_assigned_at', { ascending: true }).limit(1);
            let courierId = null, courierName = null, statusPengantaran = 'Pending', infoTeks = "Menunggu Kurir Scan Manual.";

            if(couriers && couriers.length > 0) {
                courierId = couriers[0].id; courierName = couriers[0].nama_kurir; statusPengantaran = 'In Transit';
                infoTeks = `Kurir Terpilih: <b>${courierName}</b>`;
                await supabase.from('couriers').update({ status: 'Sibuk', last_assigned_at: new Date().toISOString() }).eq('id', courierId);
            }

            const payload = {
                order_numbers: joinedResep,
                patient_name: document.getElementById('nama_pasien').value,
                patient_phone: document.getElementById('no_whatsapp').value,
                kelurahan: kelurahan,
                dropoff_address: document.getElementById('alamat').value,
                tarif: parseInt(tarifStr),
                status: statusPengantaran,
                courier_id: courierId,
                courier_name: courierName
            };

            const { data, error } = await supabase.from('deliveries').insert([payload]).select();
            if (error) return alert('Gagal: ' + error.message);

            document.getElementById('dispatchForm').classList.add('hidden');
            document.getElementById('qrContainer').classList.remove('hidden');
            document.getElementById('assigned-courier-text').innerHTML = infoTeks;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), { text: `${window.location.origin}/kurir-detail.html?id=${data[0].id}`, width: 200, height: 200 });
            loadOrders();
        });

        // --- GLOBAL ACTION MODAL ---
        let selectedOrderId = null;
        window.openActionModal = (id) => {
            selectedOrderId = id;
            document.getElementById('actionModal').classList.remove('hidden');
            const qrBox = document.getElementById('re-qr-container');
            qrBox.innerHTML = "";
            new QRCode(qrBox, { text: `${window.location.origin}/kurir-detail.html?id=${id}`, width: 150, height: 150 });
        };

        window.updateStatus = async (newStatus) => {
            if(!selectedOrderId) return;
            await supabase.from('deliveries').update({ status: newStatus }).eq('id', selectedOrderId);
            if(newStatus === 'Completed') {
                const { data } = await supabase.from('deliveries').select('courier_id').eq('id', selectedOrderId).single();
                if(data && data.courier_id) {
                    await supabase.from('couriers').update({ status: 'Tersedia' }).eq('id', data.courier_id);
                }
            }
            document.getElementById('actionModal').classList.add('hidden');
            loadOrders();
        };

        // --- INIT ---
        loadFees(); loadCouriers(); loadOrders();
    </script>
</body>
</html>
